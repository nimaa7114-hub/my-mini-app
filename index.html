<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e1a2b">
  <title>انتخاب کشور</title>

  <!-- Telegram Mini App SDK (اگر خارج از تلگرام باز شود، برنامه همچنان کار می‌کند) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <header class="app-header">
      <h1 class="title">انتخاب کشور 🌍</h1>
      <p class="subtitle">کشوری را برای شروع بازی انتخاب کنید</p>
    </header>

    <section id="country-grid" class="grid" aria-label="فهرست کشورها"></section>
  </main>

  <!-- پنل تأیید -->
  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-flag" id="confirm-flag"></div>
      <h2 class="sheet-title" id="confirm-title"></h2>
      <p class="sheet-text">آیا مطمئن هستید که می‌خواهید بازی را با این کشور شروع کنید؟</p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary" id="confirm-yes">تأیید و شروع</button>
        <button type="button" class="btn btn-ghost" id="confirm-no">انصراف</button>
      </div>
    </div>
  </div>

  <!-- پیام کوتاه -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="script.js"></script>
</body>
</html>
